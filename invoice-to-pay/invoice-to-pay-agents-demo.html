<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Invoice-to-Pay Agents Demo</title>
<meta name="description" content="Interactive demo of an AI-assisted invoice-to-pay workflow: vendor portal, fraud checks, PO matching, role-based approvals and payment tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: public pages are a marketing site; the vendor portal is a top-nav web app (teal); the finance workspace is a sidebar app (ledger blue). */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --surface-2: #eef1f5; --line: #d9dfe7; --fg: #141c27; --muted: #5a6677;
  --staff: #2350b3; --staff-soft: #e4ebfa; --vendor: #0b7566; --vendor-soft: #dff1ec;
  --accent: var(--staff); --accent-soft: var(--staff-soft); --accent-fg: #ffffff;
  --ink: #101a2b; --ink-2: #1b2841; --ink-fg: #e9eef7; --ink-muted: #9eabc2;
  --paper: #fffdf8; --paper-line: #e7e1d1; --vendor-deep: #0b6457; --ai: #6a46c9; --ai-soft: #efe9fc;
  --ok: #1b7a49; --ok-soft: #e0f1e7; --warn: #8d5a00; --warn-soft: #fbefd4; --bad: #b3261e; --bad-soft: #f9e1df;
  --font-display: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px; --shadow: 0 1px 2px rgb(16 26 43 / .06), 0 4px 14px rgb(16 26 43 / .06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1219; --surface: #141b25; --surface-2: #1a2330; --line: #283342; --fg: #e6ebf2; --muted: #98a4b5;
  --staff: #86a8f2; --staff-soft: #1b2944; --vendor: #4fc3ad; --vendor-soft: #123029; --accent-fg: #0d1219;
  --ink: #0a0f17; --ink-2: #141d2c; --ink-fg: #e9eef7; --ink-muted: #94a2b9;
  --paper: #1a2029; --paper-line: #2e3641; --vendor-deep: #0e3f38; --ai: #b9a4ff; --ai-soft: #2a2145;
  --ok: #5cc38f; --ok-soft: #13301f; --warn: #e3aa45; --warn-soft: #33270f; --bad: #f08a83; --bad-soft: #3b1c1a;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 14px rgb(0 0 0 / .25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1219; --surface: #141b25; --surface-2: #1a2330; --line: #283342; --fg: #e6ebf2; --muted: #98a4b5;
  --staff: #86a8f2; --staff-soft: #1b2944; --vendor: #4fc3ad; --vendor-soft: #123029; --accent-fg: #0d1219;
  --ink: #0a0f17; --ink-2: #141d2c; --ink-fg: #e9eef7; --ink-muted: #94a2b9;
  --paper: #1a2029; --paper-line: #2e3641; --vendor-deep: #0e3f38; --ai: #b9a4ff; --ai-soft: #2a2145;
  --ok: #5cc38f; --ok-soft: #13301f; --warn: #e3aa45; --warn-soft: #33270f; --bad: #f08a83; --bad-soft: #3b1c1a;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 14px rgb(0 0 0 / .25); color-scheme: dark; }
.is-vendor { --accent: var(--vendor); --accent-soft: var(--vendor-soft); }
.is-staff { --accent: var(--staff); --accent-soft: var(--staff-soft); }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; letter-spacing: -0.015em; text-wrap: balance; line-height: 1.2; }
h1 { font-size: clamp(26px, 3.2vw, 34px); font-weight: 700; }
h2 { font-size: 18px; font-weight: 650; }
h3 { font-size: 15px; font-weight: 650; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.eyebrow { font: 600 11.5px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { text-align: right; white-space: nowrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.spacer { flex: 1; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
svg { flex-shrink: 0; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); padding: 8px 15px; border-radius: 8px; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--fg); line-height: 1.2; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn.danger { color: var(--bad); }
.btn.danger-solid { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 7px; }
.btn.lg { padding: 12px 20px; font-size: 15.5px; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; text-align: left; text-decoration: underline; text-underline-offset: 3px; }

/* inputs */
.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.f .hint { font-weight: 400; font-size: 12.5px; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], input[type=search], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 11px; min-width: 0; color: var(--fg); font-size: 14.5px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
textarea { min-height: 72px; resize: vertical; }
input:disabled, select:disabled, textarea:disabled { background: var(--surface-2); color: var(--muted); }
input[aria-invalid="true"] { border-color: var(--bad); }
.ferr { color: var(--bad); font-size: 12.5px; font-weight: 600; }
.ferr:empty { display: none; }
.grid-f { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 16px; }
.check { display: flex; gap: 9px; align-items: flex-start; font-size: 14px; color: var(--fg); font-weight: 400; }
.check input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); }

/* pills, tags */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; line-height: 1.6; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.plain::before { display: none; }
.t-ok { color: var(--ok); background: var(--ok-soft); } .t-warn { color: var(--warn); background: var(--warn-soft); }
.t-bad { color: var(--bad); background: var(--bad-soft); } .t-info { color: var(--accent); background: var(--accent-soft); }
.t-neutral { color: var(--muted); background: var(--surface-2); }
.count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; font: 600 11.5px/20px var(--font-body); text-align: center; background: var(--accent-soft); color: var(--accent); }
.count.bad { background: var(--bad-soft); color: var(--bad); }

/* cards and panels */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.card-h { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-b { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-b.flush { padding: 0; }
.note { border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.note.info { background: var(--accent-soft); } .note.ok { background: var(--ok-soft); } .note.warn { background: var(--warn-soft); } .note.bad { background: var(--bad-soft); }
.note.plain { background: var(--surface-2); }
.note b { font-family: var(--font-display); font-weight: 650; }
.note ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.inset { background: var(--surface); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.empty { padding: 28px 18px; color: var(--muted); font-size: 14px; text-align: center; }

/* tables */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
th.num, td.num { text-align: right; }
tr.tot td { font-weight: 600; background: var(--surface-2); }
dl.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px 20px; margin: 0; }
dl.fields div { min-width: 0; }
dl.fields dt { font-size: 12px; color: var(--muted); font-weight: 600; }
dl.fields dd { margin: 2px 0 0; overflow-wrap: anywhere; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; text-align: left; min-width: 0; }
button.tile:hover { border-color: var(--accent); }
.tile .v { font: 650 23px/1.15 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tile .l { font-size: 13px; color: var(--muted); font-weight: 600; }
.tile .s { font-size: 12.5px; color: var(--muted); }
.tile.bad .v { color: var(--bad); } .tile.warn .v { color: var(--warn); } .tile.ok .v { color: var(--ok); }

/* rules list */
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rules li { display: grid; grid-template-columns: 22px 58px minmax(0, 1fr); gap: 4px 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.rules li:last-child { border-bottom: 0; }
.rules.nocheck li { grid-template-columns: 58px minmax(0, 1fr); }
.ic { width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; font: 700 11px var(--font-body); margin-top: 1px; }
.ic.ok { background: var(--ok-soft); color: var(--ok); } .ic.bad { background: var(--bad-soft); color: var(--bad); }
.ic.warn { background: var(--warn-soft); color: var(--warn); } .ic.na { background: var(--surface-2); color: var(--muted); }
.code { font: 500 12px var(--font-mono); color: var(--muted); margin-top: 2px; }
.det { color: var(--muted); font-size: 13px; }
.frbox { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 10px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); }
.frbox textarea { background: var(--surface); }

/* paper invoice */
.paper { background: var(--paper); border: 1px solid var(--paper-line); border-radius: 6px; padding: 16px 18px; font: 12px/1.6 var(--font-mono); white-space: pre-wrap; overflow-x: auto; max-height: 440px; overflow-y: auto; color: var(--fg); }

/* toast, modal, drawer */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.scrim { position: fixed; inset: 0; background: rgb(8 12 20 / .5); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 14px; width: min(640px, 100%); max-height: calc(100% - 32px); overflow: auto; box-shadow: var(--shadow); }
.drawer { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(420px, calc(100% - 32px)); max-height: 70vh; overflow: auto; z-index: 45; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 44; box-shadow: var(--shadow); }
.copybox { font: 12.5px/1.55 var(--font-mono); white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 12px; overflow-wrap: anywhere; user-select: text; }
.spinner { width: 15px; height: 15px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Public site ===== */
.pubnav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.pubnav .wrap { display: flex; align-items: center; gap: 18px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); }
.brand b { font: 750 17px var(--font-display); letter-spacing: -.02em; }
.brand small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; }
.pubnav nav { display: flex; gap: 18px; font-size: 14px; font-weight: 600; }
.pubnav nav a { color: var(--muted); text-decoration: none; } .pubnav nav a:hover { color: var(--fg); }
@media (max-width: 860px) { .pubnav nav { display: none; } }
.hero { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); gap: 48px; align-items: center; padding-block: 56px 48px; }
.hero h1 { font-size: clamp(32px, 4.6vw, 52px); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.hero .lede { font-size: 18px; color: var(--muted); max-width: 54ch; margin-top: 18px; }
.hero .row { margin-top: 26px; }
.btn.vendor { background: var(--vendor); border-color: var(--vendor); color: var(--accent-fg); }
.btn.staff { background: var(--staff); border-color: var(--staff); color: var(--accent-fg); }
@media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr); padding-block: 36px; gap: 32px; } }
.hv { position: relative; padding: 8px 0 40px 0; }
.hv .paper { max-height: none; box-shadow: var(--shadow); font-size: 11.5px; }
.hv-checks { position: absolute; right: -6px; bottom: 0; width: min(300px, 82%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; }
.hv-checks div { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.hv-checks .ic { flex-shrink: 0; }
@media (prefers-reduced-motion: no-preference) { .hv-checks div { animation: rise .5s ease both; } .hv-checks div:nth-child(2) { animation-delay: .25s; } .hv-checks div:nth-child(3) { animation-delay: .5s; } .hv-checks div:nth-child(4) { animation-delay: .75s; } .hv-checks div:nth-child(5) { animation-delay: 1s; } }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
.sec { padding-block: 56px; border-top: 1px solid var(--line); }
.sec-h { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; max-width: 64ch; }
.sec-h h2 { font-size: clamp(24px, 2.6vw, 30px); font-weight: 750; letter-spacing: -.02em; }
.sec-h p { color: var(--muted); font-size: 16px; }
.doors { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 18px; }
.door { border-radius: 14px; padding: 26px; display: flex; flex-direction: column; gap: 14px; border: 1px solid var(--line); background: var(--surface); }
.door.v { border-top: 4px solid var(--vendor); } .door.s { border-top: 4px solid var(--staff); }
.door ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.door h3 { font-size: 20px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0; counter-reset: s; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.step-c { padding: 18px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line); position: relative; }
.step-c:last-child { border-right: 0; }
.step-c .n { font: 700 13px var(--font-mono); color: var(--staff); }
.step-c h3 { font-size: 15.5px; }
.step-c p { font-size: 13.5px; color: var(--muted); }
@media (max-width: 760px) { .step-c { border-right: 0; border-bottom: 1px solid var(--line); } .step-c:last-child { border-bottom: 0; } }
.ctl { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; }
.ctl .card-b h3 { display: flex; gap: 8px; align-items: center; }
.ctl ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; font-size: 14px; }
.scen { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 16px; }
.scen .card-b { height: 100%; }
.scen ol { margin: 0; padding-left: 20px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; color: var(--muted); }
.who { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; font-weight: 600; }
.cta { background: var(--ink); color: var(--ink-fg); border-radius: 16px; padding: 32px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: center; }
.cta h2 { font-size: 26px; color: var(--ink-fg); }
.cta p { color: var(--ink-muted); margin-top: 8px; }
.cta .sel { font: 600 15px var(--font-mono); color: var(--ink-fg); user-select: all; }
.cta .btn { background: transparent; color: var(--ink-fg); border-color: var(--ink-muted); }
@media (max-width: 760px) { .cta { grid-template-columns: minmax(0, 1fr); padding: 22px; } }
.foot { padding-block: 28px 40px; font-size: 13px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; justify-content: space-between; }

/* ===== Vendor auth pages ===== */
.split { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.split-l { background: var(--vendor-deep); color: #fff; padding-block: 40px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: 40px; display: flex; flex-direction: column; gap: 26px; }
.split-l .brand { color: #fff; } .split-l .brand small { color: rgb(255 255 255 / .75); }
.split-l h1 { color: #fff; font-size: clamp(28px, 3vw, 38px); font-weight: 750; max-width: 18ch; }
.split-l p { color: rgb(255 255 255 / .85); font-size: 16px; max-width: 46ch; }
.split-l ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
.split-l li { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; }
.split-l li span { color: rgb(255 255 255 / .8); display: block; font-size: 13.5px; }
.split-l .sp-ic { width: 34px; height: 34px; border-radius: 9px; background: rgb(255 255 255 / .15); display: grid; place-items: center; flex-shrink: 0; }
.split-r { padding-block: 40px; padding-left: 40px; padding-right: max(32px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; align-items: center; justify-content: center; background: var(--bg); }
.authcard { width: min(440px, 100%); display: flex; flex-direction: column; gap: 18px; }
.authcard .card-b { padding: 24px; gap: 16px; }
.authcard h2 { font-size: 22px; }
.authlinks { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 14px; }
@media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr); min-height: 0; } .split-l { padding: 28px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px)); gap: 16px; } .split-l ul, .split-l .hide-sm { display: none; } .split-r { padding: 24px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); } }
.democard { width: min(440px, 100%); }
.demo-acct { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: center; }
.demo-acct:first-child { border-top: 0; }

/* ===== Staff login ===== */

.slogin .brand, .slogin .brand b { color: var(--ink-fg); } .slogin .brand small { color: var(--ink-muted); }
.slogin-grid { width: min(1060px, 100%); display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 860px) { .slogin-grid { grid-template-columns: minmax(0, 1fr); } }
.slogin .card { color: var(--fg); }
.staffpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 10px; }
.sp { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 2px 12px; background: var(--surface); text-align: left; color: var(--fg); }
.sp:hover { border-color: var(--staff); }
.sp .av { grid-row: 1 / span 3; }

.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--font-display); background: var(--staff-soft); color: var(--staff); flex-shrink: 0; }
.av.sm { width: 30px; height: 30px; font-size: 11.5px; }
.sso { width: 100%; }

/* ===== Vendor app shell ===== */
.vtop { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.vtop .wrap { display: flex; align-items: center; gap: 18px; padding-block: 10px; }
.vnav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.vnav a { padding: 8px 12px; border-radius: 8px; color: var(--muted); font-weight: 600; font-size: 14px; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.vnav a:hover { background: var(--surface-2); color: var(--fg); }
.vnav a[aria-current="page"] { background: var(--vendor-soft); color: var(--vendor); }
.vuser { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: 13px; }
.vuser .who-t { text-align: right; line-height: 1.25; } .vuser .who-t span { display: block; color: var(--muted); font-size: 12px; }
@media (min-width: 901px) { .vnav a { padding: 8px 9px; } .vnav a svg { display: none; } }
@media (min-width: 901px) and (max-width: 1180px) { .vuser .who-t { display: none; } .vtop .wrap { gap: 10px; } }
@media (max-width: 900px) { .vtop .wrap { flex-wrap: wrap; gap: 8px; } .vnav { order: 3; width: 100%; } .vuser .who-t { display: none; } }
.vmain { padding-block: 24px 64px; display: flex; flex-direction: column; gap: 20px; }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-h p { color: var(--muted); margin-top: 4px; }

/* ===== Staff app shell ===== */
.sapp { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--ink); color: var(--ink-fg); display: flex; flex-direction: column; gap: 14px; padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding-left: max(12px, env(safe-area-inset-left, 0px)); }
.side .brand, .side .brand b { color: var(--ink-fg); } .side .brand small { color: var(--ink-muted); }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink-muted); text-decoration: none; font-weight: 600; font-size: 14px; }
.side nav a:hover { background: var(--ink-2); color: var(--ink-fg); }
.side nav a[aria-current="page"] { background: var(--ink-2); color: var(--ink-fg); box-shadow: inset 3px 0 0 var(--staff); }
.side nav a .count { margin-left: auto; background: var(--ink-2); color: var(--ink-fg); }
.side nav a .count.bad { background: var(--bad); color: #fff; }
.side .grp { font: 600 11px var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-muted); padding: 10px 10px 4px; }
.side .me { margin-top: auto; background: var(--ink-2); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.side .me .row { flex-wrap: nowrap; }
.side .me b { font-size: 14px; display: block; } .side .me span { font-size: 12px; color: var(--ink-muted); }
.side .me .btn { background: transparent; color: var(--ink-fg); border-color: #34425c; }
.smain { min-width: 0; display: flex; flex-direction: column; }
.stop { display: flex; align-items: center; gap: 12px; padding-block: 12px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; }
.stop .search { position: relative; width: min(360px, 40vw); margin-left: auto; }
.stop .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.stop .search input { padding-left: 34px; }
.scontent { padding-block: 24px 64px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; max-width: 1280px; width: 100%; }
.menu-btn { display: none; }
@media (max-width: 960px) {
  .sapp { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; width: min(280px, 86vw); z-index: 40; transform: translateX(-100%); transition: transform .2s; }
  .side.open { transform: none; box-shadow: var(--shadow); }
  .menu-btn { display: inline-flex; }
  .stop { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .stop .search { width: auto; flex: 1; }
  .stop h1 { display: none; }
  .scontent { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
.stop h1 { font-size: 18px; }

/* guide banner */
.guide { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.guide ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.guide li .btn { margin-left: 6px; vertical-align: middle; }

/* detail */
.dhead { display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
.dhead .amt { font: 700 28px/1.1 var(--font-display); font-variant-numeric: tabular-nums; text-align: right; letter-spacing: -.02em; }
.stepper { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.stepper.v5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.st { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); min-width: 0; }
.st i { height: 5px; border-radius: 3px; background: var(--line); display: block; }
.st.done i { background: var(--ok); } .st.done { color: var(--fg); }
.st.fail i { background: var(--bad); } .st.fail { color: var(--bad); }
.st.cur i { background: var(--accent); } .st.cur { color: var(--accent); }

@media (max-width: 600px) { .stepper { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 10px; } .stepper.v5 { grid-template-columns: repeat(5, minmax(0, 1fr)); } .stepper.v5 .st span { font-size: 11px; } }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.two { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.two.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.sticky { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); }
@media (max-width: 1000px) { .two, .two.even { grid-template-columns: minmax(0, 1fr); } .sticky { position: static; } }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; font-size: 14px; }
.hist li { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 12px; }
.hist time { font: 12px var(--font-mono); color: var(--muted); padding-top: 2px; }
@media (max-width: 520px) { .hist li { grid-template-columns: minmax(0, 1fr); gap: 0; } }

/* lists */
.list { display: flex; flex-direction: column; }
.li { border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; padding: 12px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; color: var(--fg); width: 100%; }
.li:first-child { border-top: 0; }
.li:hover { background: var(--surface-2); }
.li .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .s { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .r { text-align: right; font: 500 13.5px var(--font-mono); }
.li .wrap-s { white-space: normal; }

/* drop zone, samples */
.drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 28px 18px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; background: var(--surface-2); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.samples { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.sample { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 4px; color: var(--fg); }
.sample:hover { border-color: var(--accent); }
.sample b { font-size: 14px; } .sample span { font-size: 12.5px; color: var(--muted); }
.reading { display: flex; flex-direction: column; gap: 10px; }
.reading div { display: flex; gap: 10px; align-items: center; font-size: 14.5px; color: var(--muted); }
.reading div.done { color: var(--fg); } .reading div.now { color: var(--accent); font-weight: 600; }
.lines-edit input { padding: 6px 8px; font-size: 13.5px; }

/* messages */
.thread { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.msg { border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px; background: var(--surface-2); max-width: 92%; display: flex; flex-direction: column; gap: 4px; }
.msg.mine { align-self: flex-end; background: var(--accent-soft); border-color: transparent; }
.msg .mh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.msg .mh time { margin-left: auto; color: var(--muted); font: 12px var(--font-mono); }
.msg .mb { font-size: 14.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.contact { display: flex; flex-direction: column; gap: 10px; }
.contact .sel { user-select: all; overflow-wrap: anywhere; font: 500 13.5px var(--font-mono); }

/* aging, bars */
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(120px, 170px) minmax(0, 1fr) 34px minmax(96px, auto); gap: 12px; align-items: center; font-size: 13.5px; }
.bar { height: 12px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.bar-row .n, .bar-row .a { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.bar-row.tot { border-top: 1px solid var(--line); padding-top: 8px; font-weight: 600; }
@media (max-width: 520px) { .bar-row { grid-template-columns: minmax(0, 1fr) 30px auto; } .bar { grid-column: 1 / -1; order: 5; } }

/* workflow chart */
.flow { display: flex; flex-direction: column; }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; }
.fmain { display: flex; flex-direction: column; min-width: 0; }
.faside { display: flex; align-items: center; min-width: 0; }
.fnode { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 13px; display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.fnode > span { color: var(--muted); font-size: 13px; }
.fnode.decide { border-style: dashed; border-color: var(--accent); background: var(--accent-soft); }
.fnode.ok { border-color: var(--ok); }
.fside { border-radius: 8px; padding: 9px 12px; display: flex; flex-direction: column; gap: 1px; font-size: 13px; flex: 1; min-width: 0; }
.fside.bad { background: var(--bad-soft); } .fside.warn { background: var(--warn-soft); }
.fside .eyebrow { color: inherit; }
.fv { display: block; width: 2px; height: 20px; background: var(--line); margin: 0 auto; }
.fh { display: block; flex: 0 0 22px; height: 2px; background: var(--line); }
.fcount { font: 600 11px var(--font-body); color: var(--accent); background: var(--surface); border: 1px solid var(--accent); border-radius: 99px; padding: 0 7px; white-space: nowrap; }
@media (max-width: 600px) { .frow { grid-template-columns: minmax(0, 1fr); } .faside { padding: 6px 0 0 16px; } .fh { display: none; } }


/* AI agents */
.btn.ai { background: var(--ai); border-color: var(--ai); color: var(--accent-fg); }
.btn.ai:hover { filter: brightness(1.08); }
.card.agent { border-color: color-mix(in srgb, var(--ai) 45%, var(--line)); }
.agent-ic { width: 36px; height: 36px; border-radius: 10px; background: var(--ai-soft); color: var(--ai); display: grid; place-items: center; flex-shrink: 0; }
.ai-pill { color: var(--ai); background: var(--ai-soft); }
.trace { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.trace li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; }
.trace li div { display: flex; flex-direction: column; gap: 1px; }
.trace li span:not(.ic):not(.spinner) { color: var(--muted); font-size: 13px; }
.trace li.now b { color: var(--ai); }
.aiout { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 12px; }
.ai-rec { background: var(--ai-soft); color: var(--fg); border-radius: 8px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; font-size: 14.5px; }
.ai-rec svg { color: var(--ai); }
.findings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.findings li { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.findings .fix { color: var(--ai); font-weight: 600; display: flex; gap: 4px; align-items: flex-start; }
.agents-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.agents-grid .card-b { height: 100%; }
.chat { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; padding: 4px 2px; }
.cm { max-width: 92%; padding: 9px 12px; border-radius: 12px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.cm.me { align-self: flex-end; background: var(--accent-soft); border-bottom-right-radius: 4px; }
.cm.ai { align-self: flex-start; background: var(--ai-soft); border-bottom-left-radius: 4px; }
.cm .src { display: flex; gap: 5px; align-items: center; font-size: 11.5px; font-weight: 600; color: var(--ai); margin-bottom: 4px; white-space: normal; }
/* Omnichannel inbox, manual entry, notices */
.chtag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; font-family: var(--font-body); white-space: nowrap; color: var(--chc); background: color-mix(in srgb, var(--chc) 13%, transparent); }
.chtag.email { --chc: var(--staff); } .chtag.whatsapp { --chc: #1f9d55; } .chtag.messenger { --chc: #2f6fe0; } .chtag.telegram { --chc: #1c93c9; } .chtag.portal { --chc: var(--vendor); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.qbar { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.qbar i { display: inline-block; width: 46px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; position: relative; }
.qbar i b { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.docview { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #3b3f45; padding: 18px; }
.docview .paper { background: #f6f1e4; color: #2b2b2b; font: 11.5px/1.5 var(--font-mono); white-space: pre-wrap; padding: 16px; border-radius: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.35); overflow-x: auto; }
.docview.blur .paper { filter: blur(1.6px) contrast(.7) brightness(1.04); }
.docview.faded .paper { color: #9a958a; filter: blur(.5px) contrast(.55); background: #f3eee2; }
.docview.enh .paper { filter: none; transform: none; }
.docview.faded.enh .paper { color: #6b665c; filter: contrast(.9); }
.docview .meta { position: absolute; left: 10px; top: 8px; color: #fff; font-size: 11.5px; opacity: .85; }
.keygrid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .keygrid { grid-template-columns: 1fr; } }
.msgprev { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; font-size: 13.5px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.notice { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.notice.unread { border-color: var(--vendor); box-shadow: inset 3px 0 0 var(--vendor); }
.notice.bad.unread { border-color: var(--bad); box-shadow: inset 3px 0 0 var(--bad); }
.notice p { margin: 0; white-space: pre-wrap; font-size: 14px; }
/* People Prime Worldwide bar, top-left on every screen */
.ppbar { background: var(--ink); color: var(--ink-fg); border-bottom: 1px solid var(--ink-2); position: relative; z-index: 25; }
.ppbar .in { display: flex; align-items: center; gap: 12px; padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 13px; }
.ppbrand { display: inline-flex; align-items: center; gap: 9px; color: var(--ink-fg); text-decoration: none; }
.ppmark { width: 26px; height: 26px; border-radius: 6px; background: #ffffff; color: #101a2b; display: grid; place-items: center; font: 800 11.5px/1 var(--font-display); letter-spacing: -.02em; flex-shrink: 0; }
.ppbrand b { font: 700 14px var(--font-display); letter-spacing: -.01em; white-space: nowrap; }
.ppbar .sep { width: 1px; height: 16px; background: var(--ink-muted); opacity: .5; }
.ppbar .tag { color: var(--ink-muted); white-space: nowrap; }
.ppbar .links { margin-left: auto; display: flex; gap: 16px; }

.split, .slogin, .sapp { min-height: calc(100vh - 41px); }
.side { height: 100vh; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Leadership dashboard */
.lcharts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 14px; }
.lchart { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lc-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 13px; color: var(--muted); font-weight: 600; }
.lc-h b { font: 650 18px/1.1 var(--font-display); color: var(--fg); font-variant-numeric: tabular-nums; }
.lchart svg { width: 100%; height: auto; display: block; overflow: visible; }
.lc-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }

.lc-pt:hover circle { r: 5; }
.lc-axis { stroke: var(--line); stroke-width: 1; }
.lc-mark { stroke: var(--ai); stroke-width: 1; stroke-dasharray: 3 3; }
.lc-mt { fill: var(--ai); font-size: 10px; font-weight: 600; }
.lc-t { fill: var(--muted); font-size: 10px; }
.lc-good { color: var(--ok); font-weight: 600; }

function findVendor(e) {

const findPO = (no) => REF.pos.find((p) => norm(p.id) === norm(no)) || null;

function mapLine(line, po) {
  if (!po) return null;
  const s = norm(line.sku);
  let m = s ? po.lines.find((l) => norm(l.sku) === s) : null;
  if (!m) {
    const words = (t) => new Set(String(t || "").toLowerCase().split(/[^a-z0-9]+/).filter((w) => w.length > 2));
    const lw = words(line.description); let best = null, score = 0;

function allReceipts() { return [...REF.receipts, ...S.receiptsExtra]; }

function evaluate(inv) {

    !po ? `PO “${e.po_number || "—"}” not found` : !v ? `${po.id} found, vendor unknown` : po.vendor !== v.id ? `${po.id} was raised on ${po.vendor}, not ${v.id}` : po.status !== "open" ? `${po.id} is ${po.status}` : `${po.id} dated ${fmtDate(po.date)}, open`);

  // R-05 line arithmetic

  add("R-05", "Line amounts = quantity × rate", lines.length > 0 && !badLines.length,
    !lines.length ? "No lines" : badLines.length ? badLines.map((x) => `Line ${x.i + 1}: ${qtyf(x.q)} × ${money(x.p)} ≠ ${money(x.a)}`).join("; ") : `${lines.length} line${lines.length > 1 ? "s" : ""} check out`);

  // R-06 totals

  if (sub != null && rate != null && (tax == null || Math.abs((sub * rate) / 100 - tax) > tol)) probs.push(`${rate}% of ${money(sub)} is ${money((sub * rate) / 100)}, tax shows ${money(tax)}`);
  if (sub != null && tax != null && (tot == null || Math.abs(sub + tax - tot) > tol)) probs.push(`subtotal + tax = ${money(sub + tax)}, total shows ${money(tot)}`);
  add("R-06", "Subtotal, tax and total add up", !probs.length, probs.length ? probs.join("; ") : `${money(sub)} + ${money(tax)} = ${money(tot)}`);

const invNoKey = (s) => String(s || "").toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean).map((t) => (/^\d+$/.test(t) ? String(Number(t)) : t)).join("");

const vendKey = (e) => norm(e.vendor_gstin) || nameKey(e.vendor_name);

function fraudCfg() { const f = { ...FRAUD_DEFAULTS }; for (const [k, v] of Object.entries(S.settings.fraud || {})) if (Number(v) > 0) f[k] = Number(v); return f; }

function fraudRules() {
  const F = fraudCfg();
  return [
    ["FC-1", "Vendor is registered in the buyer's vendor master", "block"],
    ["FC-2", "Vendor account, EIN and name match the vendor registration", "block"],
    ["FC-3", "Not an exact duplicate: same vendor and invoice number (ignoring separators and leading zeros), or the same file", "block"],
    ["FC-4", `Not a possible duplicate: same vendor and amount within ${F.dupDays} days, or on the same PO`, "review"],
    ["FC-5", `Vendor registered more than ${F.newVendorDays} days ago`, "review"],
    ["FC-6", `Invoice total within the ${money(F.highValue)} high-value limit`, "review"],
    ["FC-7", `Vendor's invoices in any ${F.splitDays} days stay within ${money(F.splitLimit)} in total (split-invoice check)`, "review"],
    ["FC-8", `Vendor's bank details not changed in the last ${F.bankChangeDays} days`, "review"],
    ["FC-9", "Invoice quotes a PO that exists, is open and was issued to this vendor", "block"],
    ["FC-10", "Every invoice line is an item on that PO", "block"],
    ["FC-11", "This invoice plus earlier invoices on the PO stay within the PO value including sales tax", "review"],
    ["FC-12", "Invoice is dated on or after the PO date", "review"],

}

function fraudCheck(inv, e, tot) {
  const F = fraudCfg(); const R = fraudRules(); const checks = []; const d = inv.decision || {};
  const add = (code, pass, detail) => { const r = R.find((x) => x[0] === code); checks.push({ code, name: r[1], sev: r[2], pass, detail }); };
  const recvd = new Date(inv.createdAt || Date.now()); const DAY = 864e5;
  // FC-1 registered
  const g = norm(e.vendor_gstin);
  const reg = g ? REF.vendors.find((x) => norm(x.gstin) === g) : null;
  add("FC-1", !!reg, reg ? `${reg.id} · ${reg.name}, registered ${fmtDate(reg.registeredOn)}` : `EIN ${e.vendor_gstin || "(none on invoice)"} isn't in the vendor master. The invoice can't be processed until the vendor is registered.`);
  // FC-2 profile match
  if (!reg) add("FC-2", null, "Not checked: vendor isn't registered");
  else {
    const nk = nameKey(e.vendor_name), mk = nameKey(reg.name); const nameOk = !nk || mk.includes(nk) || nk.includes(mk);
    const acct = inv.source?.kind === "seller" ? inv.source.vendorId : null;
    if (acct && acct !== reg.id) add("FC-2", false, `Submitted from the ${acct} vendor account, but the EIN belongs to ${reg.id}`);
    else if (!nameOk) add("FC-2", false, `Name on invoice “${e.vendor_name}” doesn't match “${reg.name}”, the registered name for this EIN`);
    else add("FC-2", true, acct ? `Vendor account ${acct}, EIN and name match the vendor record` : "EIN and name match the vendor record");
  }
  // FC-3 exact duplicate
  const myV = vendKey(e), myN = invNoKey(e.invoice_number), myH = inv.source?.fileHash;
  const earlier = [...S.invoices.values()].filter((o) => o.id !== inv.id && o.extracted && o.createdAt < inv.createdAt && !o.decision?.returned);
  const exact = earlier.find((o) => (myN && vendKey(o.extracted) === myV && invNoKey(o.extracted.invoice_number) === myN) || (myH && o.source?.fileHash === myH));
  add("FC-3", !exact, exact ? (myH && exact.source?.fileHash === myH ? `The same file was already received on ${fmtTime(exact.createdAt)} as invoice ${exact.extracted.invoice_number}` : `Invoice ${exact.extracted.invoice_number} from this vendor was already received on ${fmtTime(exact.createdAt)}`) : "No earlier invoice with this vendor and number, and no identical file");
  // FC-4 possible duplicate
  const idt = e.invoice_date ? Date.parse(e.invoice_date) : NaN;
  const near = !exact && tot != null ? earlier.find((o) => vendKey(o.extracted) === myV && Math.abs((o.extracted.total || 0) - tot) <= REF.amountTolerance &&
    ((!isNaN(idt) && o.extracted.invoice_date && Math.abs(Date.parse(o.extracted.invoice_date) - idt) <= F.dupDays * DAY) || (e.po_number && norm(o.extracted.po_number) === norm(e.po_number)))) : null;
  add("FC-4", !near, near ? `Same vendor and same amount ${money(tot)} as invoice ${near.extracted.invoice_number} dated ${fmtDate(near.extracted.invoice_date)}${near.extracted.po_number && norm(near.extracted.po_number) === norm(e.po_number) ? ", on the same PO" : ""}` : `No other invoice from this vendor for the same amount within ${F.dupDays} days or on the same PO`);

  const age = reg?.registeredOn ? Math.floor((recvd - Date.parse(reg.registeredOn)) / DAY) : null;
  const isNew = age != null && age <= F.newVendorDays;
  add("FC-5", reg ? !isNew : null, !reg ? "Not checked: vendor isn't registered" : isNew ? `Registered on ${fmtDate(reg.registeredOn)}, ${age} days before this invoice arrived (new-vendor period is ${F.newVendorDays} days)` : `Registered ${fmtDate(reg.registeredOn)}`);
  // FC-6 high value

  // FC-7 split invoicing over a rolling window
  const win = [...S.invoices.values()].filter((o) => o.extracted && o.id !== inv.id && vendKey(o.extracted) === myV && !o.decision?.returned && o.decision?.approval?.decision !== "rejected" && !o.decision?.fraudRejected && o.createdAt <= inv.createdAt && recvd - new Date(o.createdAt) <= F.splitDays * DAY);
  win.push(inv);
  const sum = win.reduce((s, o) => s + (num(o.extracted?.total) || 0), 0);
  const split = win.length >= 2 && sum > F.splitLimit && !high;
  add("FC-7", !split, split ? `${win.length} invoices from this vendor in ${F.splitDays} days total ${money(sum)}, above the ${money(F.splitLimit)} limit: ${win.map((o) => o.extracted?.invoice_number || "?").join(", ")}` : `${win.length} invoice${win.length === 1 ? "" : "s"} from this vendor in ${F.splitDays} days, ${money(sum)} in total`);
  // FC-8 recent bank change
  const bc = reg?.bankChangedOn ? Math.floor((recvd - Date.parse(reg.bankChangedOn)) / DAY) : null;
  const recent = bc != null && bc >= 0 && bc <= F.bankChangeDays;
  add("FC-8", reg ? !recent : null, !reg ? "Not checked: vendor isn't registered" : recent ? `Bank account changed on ${fmtDate(reg.bankChangedOn)}, ${bc} days before this invoice` : reg.bankChangedOn ? `Last bank change ${fmtDate(reg.bankChangedOn)}` : "No bank detail changes on record");
  // FC-9 to FC-12: PO validation
  const po = findPO(e.po_number); const lines = e.line_items || [];

  if (po && po.vendor === v.id) lines.forEach((l) => {
    const m = mapLine(l, po); if (!m) return;
    if (l.unit_price != null && l.unit_price > m.price * (1 + REF.priceTolerance)) warnings.push(`${m.sku} rate ${money(l.unit_price)} is above the PO rate ${money(m.price)}. AP will hold the invoice for review.`);

    const avail = acc - invoicedQty(po.id, m.sku, null);

  });
  if (!v.active) warnings.push("Your vendor account is on hold with the buyer. You can submit, but payment waits until the buyer's vendor team clears the hold.");
  (e.warnings || []).forEach((w) => warnings.push("Claude noticed: " + w));
  return { checks, warnings, fieldErr, blocking: checks.filter((c) => !c.pass) };
}

function sellerStatus(inv) {
  const ev = inv.extracted ? evaluate(inv) : null; const st = statusOf(inv, ev);
  let [label, tone, next] = SELLER_STATUS[st] || ["Received", "t-neutral", ""];
  if (st.startsWith("pending_approval") && ev) { const n = ev.plan.steps.length; const g = approvalState(inv, ev.plan).given.length; if (n > 1) label = `In approval (${g + 1} of ${n})`; }
  if (st === "sent" && inv.extracted?.due_date) next = `With the buyer's payments team for payment by ${fmtDate(inv.extracted.due_date)}.`;
  if (st === "paid") next = `Paid ${money(inv.decision.paid.amount)} on ${fmtDate(inv.decision.paid.date)}. Payment reference ${inv.decision.paid.ref}.`;
  if (st === "rejected" && inv.decision.fraudRejected) next = "The buyer rejected this invoice. Their AP team will contact you.";
  else if (st === "rejected" && inv.decision.approval?.comment) next = `Rejected by the buyer: “${inv.decision.approval.comment}”`;
  if (st === "returned") next = `Returned by the buyer: “${inv.decision.returned.comment}”. Correct it and submit a new invoice.`;
  return { st, ev, label, tone, next };
}

function sellerTimeline(inv, ss) {
  const d = inv.decision || {}; const out = [];
  out.push([inv.createdAt, inv.source?.kind === "seller" ? "Submitted on the vendor portal" : "Received by the buyer's AP team"]);
  if (inv.extraction?.at) out.push([inv.extraction.at, "Checked against the buyer's invoice rules"]);
  if (d.override) out.push([d.override.at, "AP query resolved"]);
  const n = ss.ev ? ss.ev.plan.steps.length : 1;
  (d.approvals || []).filter((a) => a.decision === "approved").forEach((a) => out.push([a.at, n > 1 ? `Approval ${a.level} of ${n} given` : "Approved"]));
  if (d.approval?.decision === "rejected") out.push([d.approval.at, "Rejected"]);
  if (d.fraudRejected) out.push([d.fraudRejected.at, "Rejected"]);
  if (inv.decision && Object.keys(d.fraudReviews || {}).length) out.push([Object.values(d.fraudReviews).map((x) => x.at).sort().pop(), "Buyer checks completed"]);
  if (d.returned) out.push([d.returned.at, "Returned to you"]);
  [...(d.holds || []), d.paymentHold].filter(Boolean).forEach((x) => { out.push([x.at, "Payment put on hold by the buyer"]); if (x.releasedAt) out.push([x.releasedAt, "Payment hold released"]); });
  if (d.payment?.status === "sent") out.push([d.payment.at, "Sent to the payments team"]);
  if (d.paid) out.push([d.paid.at, `Paid on ${fmtDate(d.paid.date)}, reference ${d.paid.ref}`]);
  return out.sort((a, b) => (a[0] < b[0] ? -1 : 1));
}

const PBKDF2_ITER = 150000;

const hexOf = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");

const unhex = (s) => new Uint8Array(String(s).match(/../g).map((x) => parseInt(x, 16)));

async function hashPw(pw, saltHex, iter = PBKDF2_ITER) {
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return hexOf(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: unhex(saltHex), iterations: iter, hash: "SHA-256" }, key, 256));
}

async function sha256File(f) { return hexOf(await crypto.subtle.digest("SHA-256", await f.arrayBuffer())); }

function pwPolicy(pw, uid) {
  if (pw.length < 10) return "Use at least 10 characters.";
  if (!/[A-Z]/.test(pw) || !/[a-z]/.test(pw) || !/\d/.test(pw) || !/[^A-Za-z0-9]/.test(pw)) return "Use upper and lower case letters, a number and a symbol.";
  if (uid && pw.toLowerCase().includes(uid.toLowerCase())) return "Don't include your user ID in the password.";
  return null;
}

/* ---------- Dates relative to today ---------- */
function computeShift() { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((t - new Date(ANCHOR + "T00:00:00")) / DAY); }
const shiftTs = (s) => (s && SHIFT ? new Date(Date.parse(s) + SHIFT * DAY).toISOString() : s);
const shiftDay = (s) => { if (!s || !SHIFT) return s; const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + SHIFT); return isoDay(d); };
function shiftText(t) {
  if (!SHIFT) return t;
  t = t.replace(/\b(\d{2})([-/.])(\d{2})\2(20\d{2})\b/g, (m, mm, sep, dd, yy) => { const d = new Date(+yy, +mm - 1, +dd); d.setDate(d.getDate() + SHIFT); return pad2(d.getMonth() + 1) + sep + pad2(d.getDate()) + sep + d.getFullYear(); });
  return t.replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (\d{1,2}), (20\d{2})\b/g, (m, mon, dd, yy) => { const d = new Date(+yy, MONTHS.indexOf(mon), +dd); d.setDate(d.getDate() + SHIFT); return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); });
}
function shiftDeep(o) {
  if (typeof o === "string") return /^\d{4}-\d{2}-\d{2}T/.test(o) ? shiftTs(o) : /^\d{4}-\d{2}-\d{2}$/.test(o) ? shiftDay(o) : o;
  if (Array.isArray(o)) return o.map(shiftDeep);
  if (o && typeof o === "object") { const r = {}; for (const [k, v] of Object.entries(o)) r[k] = shiftDeep(v); return r; }
  return o;
}

  REF.vendors.forEach((v) => { v.registeredOn = shiftDay(v.registeredOn); v.bankChangedOn = shiftDay(v.bankChangedOn); });
  REF.pos.forEach((p) => (p.date = shiftDay(p.date)));

}

/* ---------- Work queues by role ---------- */
function tasksFor(u, all) {
  all = all || rows(); const out = [];
  const add = (r, why, act) => out.push({ r, why, act });
  for (const r of all) {
    const { inv, ev, st } = r; const ap = ev ? approvalState(inv, ev.plan) : null; const unread = unreadCount(inv, "buyer");
    switch (u.role) {
      case "ap_clerk":
        if (st === "exception") add(r, `${ev.rules.filter((x) => !x.pass).length} business rule${ev.rules.filter((x) => !x.pass).length > 1 ? "s" : ""} failed`, "Fix or return");
        else if (st === "awaiting_grn") add(r, "Goods not fully received or accepted", "Check receipt");
        else if (unread) add(r, "Vendor sent a message", "Reply");
        break;
      case "ap_manager":
        if ((st === "pending_approval") && ap.next?.level === 1) add(r, `Approval 1 of ${ev.plan.steps.length}`, "Approve");
        else if (st === "exception") add(r, "Exception: override or return", "Decide");
        else if (st === "payment_stopped" && inv.decision.paymentHold.by !== u.id) add(r, "Payment on hold", "Release when resolved");
        break;
      case "controller":
        if (st === "pending_approval_2" && ap.next?.level === 2) add(r, "Approval 2 of 2", "Approve");
        else if (st === "payment_stopped" && inv.decision.paymentHold.by !== u.id) add(r, "Payment on hold", "Release when resolved");
        break;
      case "fraud":
        if (st === "fraud_review") add(r, ev.fraud.open.map((c) => FRAUD_QUEUE[c.code]).join(", "), "Review");
        else if (st === "fraud_blocked") add(r, "Blocked: " + ev.fraud.checks.filter((c) => c.pass === false && c.sev === "block").map((c) => c.code).join(", "), "Return or reject");
        break;
      case "payments":
        if (st === "sent") { const ag = agingOf(inv.extracted); add(r, ag.over > 0 ? `Ready to pay · ${ag.over} days overdue` : `Ready to pay · due ${fmtDate(ag.due)}`, "Record payment"); }
        break;
    }
  }
  if (typeof AGX !== "undefined" && AGX.tasks) AGX.tasks(u, all, add, out);
  return out;
}

function vendorTrack(inv, ss) {
  const st = ss.st; const labels = ["Submitted", "Checks", "Approval", "Sent for payment", "Paid"];
  let stage = st.startsWith("pending_approval") ? 2 : ["approved", "sent", "payment_stopped"].includes(st) ? 3 : st === "paid" ? 5 : 1;
  const failAt = st === "rejected" ? (inv.decision?.approval?.decision === "rejected" ? 2 : 1) : st === "returned" ? 1 : -1;
  const hold = ["fraud_blocked", "exception", "awaiting_grn", "payment_stopped"].includes(st);
  return `<div class="stepper v5">${labels.map((l, i) => { let c = "";
    if (failAt >= 0) c = i < failAt ? "done" : i === failAt ? "fail" : "";
    else c = i < stage ? "done" : i === stage ? (hold ? "over" : "cur") : "";
    return `<div class="st ${c}"><i></i><span>${l}</span></div>`; }).join("")}</div>`;
}

function startVendorRead(sid) {
  const s = SAMPLES.find((x) => x.id === sid);

  const tick = () => { const sb = S.ui.submit; if (!sb || sb.step !== "reading" || sb.sampleId !== sid) return;
    if (sb.readStep < 3) { sb.readStep++; render(); setTimeout(tick, 650); }
    else { S.ui.submit = { step: "review", sampleId: sid, fileName: s.label + ".pdf", draft: JSON.parse(JSON.stringify(normalizeExtract(s.expected))) }; render(); } };
  setTimeout(tick, 650);
}
async function startVendorUpload(f) {
  if (!/pdf|png|jpe?g/i.test(f.type + f.name)) { toast("Upload a PDF, JPG or PNG."); return; }
  if (f.size > 10 * 1024 * 1024) { toast("That file is over 10 MB. Upload a smaller copy."); return; }
  const v = myVendor(); let hash = null; try { hash = await sha256File(f); } catch {}
  S.ui.submit = { step: "review", sampleId: null, fileName: f.name, mime: f.type, size: f.size, fileHash: hash, draft: normalizeExtract({ vendor_name: v.name, vendor_gstin: v.gstin, vendor_address: v.city, line_items: [{ description: "" }] }) };
  render();
}

/* ---------- Invoice detail ---------- */
function stepper(inv, ev, st) {
  const d = inv.decision || {};
  const fr = d.fraudRejected || ev.fraud.blocked ? "fail" : ev.fraud.open.length ? "over" : "done";
  const fraudDone = fr === "done";
  const rules = !fraudDone && fr !== "over" ? "" : ev.rulesOk ? "done" : d.override ? "over" : "fail";
  const grn = !fraudDone && fr !== "over" ? "" : ev.grnOk ? "done" : "over";
  const n = ev.plan.steps.length; const g = approvalState(inv, ev.plan).given.length;
  const appr = d.approval?.decision === "approved" ? "done" : d.approval?.decision === "rejected" || d.returned ? "fail" : st.startsWith("pending_approval") ? "cur" : "";
  const held = !!d.paymentHold?.active;
  const pay = held ? "fail" : d.paid ? "done" : st === "sent" ? "cur" : "";
  const steps = [["done", "Received"], ["done", "Read by AI"], [fr, "Fraud checks"], [rules, "Business rules"], [grn, "Goods receipt"], [appr, d.returned ? "Returned" : n > 1 ? `Approval ${Math.min(g + (appr === "done" ? 0 : 1), n)} of ${n}` : "Approval"], [pay, held ? "Payment stopped" : d.paid ? "Paid" : "Payment"]];
  return `<div class="stepper" aria-label="Progress">${steps.map(([c, l]) => `<div class="st ${c}"><i></i><span>${l}</span></div>`).join("")}</div>`;
}

/* ---------- 1. Fraud investigation agent ---------- */
function nearDuplicate(inv, e, tot) {

const lineSig = (ls) => (ls || []).map((l) => `${norm(l.sku)}|${l.quantity}|${l.amount}`).sort().join(";");

    { t: "Looked up the vendor master", r: reg ? `${reg.name} (${reg.id}), registered ${fmtDate(reg.registeredOn)}, ${reg.active ? "active" : "blocked"}` : `No vendor with EIN ${e.vendor_gstin || "(none on invoice)"}` },
    { t: "Checked the EIN with IRS TIN Matching", r: !GSTIN_RE.test(norm(e.vendor_gstin)) ? "Not a valid EIN" : reg ? "Name and EIN combination matches IRS records (simulated lookup)" : "Valid EIN, but it belongs to a business that isn't our vendor (simulated lookup)" },
    { t: "Reviewed this vendor's invoice history", r: others.length ? `${others.length} other invoice${others.length > 1 ? "s" : ""}, ${money(sumOf(others))} in total` : "No earlier invoices from this vendor" },
    { t: "Compared with the PO and goods receipts", r: po ? `${po.id} (issued to ${po.vendor}): ${money(u.value)} with sales tax, ${money(u.used)} already invoiced, ${money(u.left)} left${rcpts.length ? `; receipts ${rcpts.join(", ")}` : "; no receipts yet"}` : "No valid PO quoted" },
    { t: "Checked bank details", r: reg?.bankChangedOn ? `Changed on ${fmtDate(reg.bankChangedOn)}; account now ${reg.bank}` : reg ? `Unchanged (${reg.bank})` : bankOnInvoice ? "The invoice prints its own bank account, which isn't in our records" : "No bank details on record" },

      case "FC-2": risk = "High"; rec = "Reject"; text = `${c.detail}. Someone may be using another vendor's account or identity. Reject and alert the vendor team.`; break;
      case "FC-3": risk = "High"; rec = "Reject"; text = `${c.detail}. Paying it would pay the same invoice twice. Reject it.`; break;
      case "FC-4": { const nd = nearDuplicate(inv, e, tot); const same = nd && lineSig(nd.extracted.line_items) === lineSig(e.line_items);
        risk = same ? "High" : "Low"; rec = same ? "Reject" : "Clear";
        text = same ? `Same items, quantities and amount as ${nd.extracted.invoice_number} (${fmtDate(nd.extracted.invoice_date)}), with a new invoice number. Most likely the same supply billed twice. Reject unless the requester confirms a second delivery.` : `Same amount as ${nd ? nd.extracted.invoice_number : "an earlier invoice"}, but different items. Probably a coincidence; confirm with the requester.`; break; }
      case "FC-5": { const hasRcpt = rcpts.length > 0; risk = hasRcpt ? "Low" : "Medium"; rec = hasRcpt ? "Clear after checks" : "Review";
        text = `New vendor, registered ${fmtDate(reg?.registeredOn)}. ${po && po.vendor === reg?.id ? `We raised ${po.id} for them` : "No PO of ours links to them"}${hasRcpt ? ` and ${rcpts.join(", ")} confirms delivery` : ""}. Verify the bank account and do the call-back, then clear.`; break; }
      case "FC-6": { risk = ev.grnOk && u && u.left >= tot - 1 ? "Low" : "Medium"; rec = risk === "Low" ? "Clear" : "Review";
        text = risk === "Low" ? `High value, but it matches ${po.id} exactly and every line is received and accepted (${rcpts.join(", ")}). Evidence supports paying it.` : `High value and not fully matched to the PO or receipts. Check with the budget owner before clearing.`; break; }
      case "FC-7": { const F = fraudCfg(); const win = others.filter((o) => (Date.parse(inv.createdAt) - Date.parse(o.createdAt)) <= F.splitDays * DAY && o.createdAt <= inv.createdAt);
        const samePO = win.every((o) => norm(o.extracted.po_number) === norm(e.po_number));
        const skus = new Set([...win.flatMap((o) => o.extracted.line_items.map((l) => norm(l.sku))), ...e.line_items.map((l) => norm(l.sku))]);
        const distinct = skus.size === win.reduce((n, o) => n + o.extracted.line_items.length, 0) + e.line_items.length;
        risk = samePO && distinct ? "Low" : "Medium"; rec = risk === "Low" ? "Clear" : "Review";
        text = risk === "Low" ? `The invoices bill different lines of the same PO (${e.po_number}), which matches how the PO was raised. Looks like normal billing, not splitting to stay under the limit.` : `Several invoices from this vendor in a short window. Check whether one purchase was split to avoid the high-value review.`; break; }

/* Vendor guidance agent: tells each vendor, periodically, the best way to send invoices */
const CH_PERF = { portal: { first: 100, days: 3 }, email: { first: 93, days: 5 }, whatsapp: { first: 58, days: 9 }, messenger: { first: 41, days: 11 }, telegram: { first: 70, days: 8 } };
const CH_HIST = { V1001: { portal: 9, email: 2, messenger: 1 }, V1002: { email: 6, whatsapp: 2 }, V1003: { email: 5, whatsapp: 2 }, V1004: { email: 4 }, V1005: { portal: 1, whatsapp: 3 } };
const CH_HIST_BAD = { V1001: { manual: 1, unread: 0 }, V1002: { manual: 1, unread: 0 }, V1003: { manual: 1, unread: 0 }, V1004: { manual: 0, unread: 0 }, V1005: { manual: 2, unread: 1 } };
const FREQ = { monthly: ["Monthly", 30], quarterly: ["Every quarter", 91], off: ["Off", 0] };
function vendorStats(v) {
  const c = { ...(CH_HIST[v.id] || {}) }; const b = { ...(CH_HIST_BAD[v.id] || { manual: 0, unread: 0 }) };
  for (const d of S.docs) if (d.vendorId === v.id && ["invoice", "nopo"].includes(d.kind) && d.status !== "new") { c[d.ch] = (c[d.ch] || 0) + 1; if (["manual", "keyed", "unreadable"].includes(d.status)) b.manual++; if (d.status === "unreadable") b.unread++; }
  const total = Object.values(c).reduce((a, n) => a + n, 0); const portal = c.portal || 0; const photo = (c.whatsapp || 0) + (c.messenger || 0) + (c.telegram || 0);
  const main = Object.entries(c).sort((x, y) => y[1] - x[1])[0]?.[0] || "email";
  const send = v.active && !v.payee && total > 0 && (portal / Math.max(1, total) < 0.8 || b.unread > 0 || photo > 0);
  return { c, total, portal, photo, ...b, main, acct: hasPortal(v.id), send };
}
function guidanceMsg(v, st) {
  const acct = [...S.accounts.values()].find((a) => a.vendorId === v.id);
  const list = Object.entries(st.c).sort((x, y) => y[1] - x[1]).map(([k, n]) => `${n} ${k === "portal" ? "on the vendor portal" : k === "email" ? "by email" : "by " + CH[k].label}`).join(", ");
  const slow = Object.keys(st.c).filter((k) => k !== "portal" && k !== "email");
  const lines = [`Hello ${acct?.contactName?.split(" ")[0] || v.name + " team"},`, "", `Over the last 90 days you sent us ${st.total} invoices: ${list}.`];
  if (st.photo) lines.push(`${st.manual} had to be keyed by hand from photos${st.unread ? `, and ${st.unread} couldn't be read at all and had to be sent again` : ""}. Invoices sent as photos took about ${CH_PERF[slow[0] || "whatsapp"].days} days to reach approval; on the vendor portal it's about ${CH_PERF.portal.days} days.`);
  else if (st.portal) lines.push("Thank you for using the vendor portal for most of them.");
  lines.push("", `The best way to send invoices to ${BUYER.short}:`, `1. Upload the original PDF on the vendor portal${st.acct ? "" : " (register with your EIN; it takes two minutes)"}. It checks the invoice against our policy before you send it, and you can track it to payment.`, `2. If you can't use the portal, email the original PDF (not a scan or photo) to ${AP_MAIL}, one invoice per email, with our PO number on it.`, "Please don't send invoices as WhatsApp, Messenger or Telegram photos. They take longer and we may not be able to read them.", "", `Accounts Payable, ${BUYER.name}`);
  return lines.join("\n");
}
const guideFreq = () => S.settings.guideFreq || "monthly";
const nextGuide = () => { const f = FREQ[guideFreq()]; const last = S.guideRuns[0]; return !f[1] ? null : new Date((last ? Date.parse(last.at) : Date.now()) + f[1] * DAY); };
function sendGuidance(auto) {
  const at = nowISO(); let n = 0;
  for (const v of REF.vendors.filter((x) => !x.payee)) { const st = vendorStats(v); if (!st.send) continue; addNotice({ vendorId: v.id, kind: "guidance", title: `The best way to send invoices to ${BUYER.short}`, body: guidanceMsg(v, st), channels: [st.acct && "Vendor portal", "Email"].filter(Boolean), by: auto ? null : S.staff?.id, mail: !auto }); n++; }
  S.guideRuns.unshift({ at, n, by: auto ? null : S.staff?.id }); persist(); return n;
}
function guidanceAgent() {
  const vs = REF.vendors.filter((v) => !v.payee && CH_HIST[v.id]).map((v) => ({ v, st: vendorStats(v) })); const to = vs.filter((x) => x.st.send); const last = S.guideRuns[0]; const nx = nextGuide();
  const steps = [
    { t: "Counted each vendor's invoices by channel", r: `${vs.reduce((a, x) => a + x.st.total, 0)} invoices from ${vs.length} vendors in the last 90 days` },
    { t: "Measured how each channel performed", r: `Read first time: portal ${CH_PERF.portal.first}%, email PDF ${CH_PERF.email.first}%, WhatsApp photo ${CH_PERF.whatsapp.first}%, Messenger photo ${CH_PERF.messenger.first}%` },
    { t: "Found vendors who'd benefit from a nudge", r: `${to.length} vendor${to.length === 1 ? "" : "s"}; ${vs.length - to.length} ${vs.length - to.length === 1 ? "is" : "are"} blocked or already on the portal` },
    { t: "Wrote a personal note for each", r: "Their own numbers, the fastest route and what to avoid" },
  ];
  const out = () => `<div class="aiout"><b>Best way to send invoices, by vendor</b><div class="scroll"><table><thead><tr><th>Vendor</th><th>How they sent invoices (90 days)</th><th>Keyed by hand / unreadable</th><th>Note</th></tr></thead><tbody>
    ${vs.map(({ v, st }) => `<tr><td style="min-width:170px"><b class="small">${h(v.name)}</b><div class="small muted">${st.acct ? "Has a portal account" : "No portal account"}</div></td><td><div class="chips">${Object.entries(st.c).sort((x, y) => y[1] - x[1]).map(([k, n]) => `${chTag(k)}<span class="small">${n}</span>`).join("")}</div></td><td class="small">${st.manual} / ${st.unread}</td>
      <td style="min-width:260px">${st.send ? `<details><summary class="small"><b>${st.photo ? "Move from photos to the portal" : st.acct ? "Use the portal for everything" : "Register on the portal"}</b></summary><div class="copybox" style="margin-top:6px">${h(guidanceMsg(v, st))}</div></details>` : `<span class="small muted">${v.active ? "No note needed: already uses the portal" : "Skipped: vendor is blocked"}</span>`}</td></tr>`).join("")}</tbody></table></div>
    ${S.ui.guideSent ? `<div class="note ok"><b>Sent to ${S.ui.guideSent} vendors</b><span>Each sees it on the vendor portal and by email. The next automatic run is on ${nx ? fmtDate(isoDay(nx)) : "— (schedule off)"}.</span></div>` : can("message") ? `<div class="row"><button class="btn sm ai" data-agact="guide-send">${icon("send", 14)} Send to ${to.length} vendor${to.length === 1 ? "" : "s"}</button><span class="small muted">Each vendor gets their own note on the portal and by email.</span></div>` : ""}</div>`;
  return `<div class="card"><div class="card-b"><div class="row" style="justify-content:space-between"><div class="row" style="gap:14px">
      <label class="f" for="gd-freq" style="min-width:180px">Tell vendors the best way to send invoices<select id="gd-freq" ${can("message") ? "" : "disabled"}>${Object.entries(FREQ).map(([k, [l]]) => `<option value="${k}" ${guideFreq() === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <div class="small"><b>Last run</b><div class="muted">${last ? `${fmtDate(last.at.slice(0, 10))}, ${last.by ? "by " + h(nameOf(last.by)) : "automatic"} · ${last.n} vendors` : "Never"}</div></div>
      <div class="small"><b>Next automatic run</b><div class="muted">${nx ? fmtDate(isoDay(nx)) : "Off"}</div></div></div></div></div></div>
    ${agentPanel("guidance", "Vendor guidance agent", "Tells each vendor the best way to send invoices", steps, out, { icon: "megaphone", intro: `Runs ${FREQ[guideFreq()][0].toLowerCase()} on its own. It reviews how each vendor sent invoices and how each channel performed, then writes each vendor a personal note on the fastest way to get paid. Run it now to see this month's notes.`, runLabel: "Review vendors now" })}`;
}

/* ---------- 4. Reconciliation agent ---------- */
function bankStatement() {
  const sent = rows().filter((r) => r.st === "sent");
  const today = isoDay(new Date());
  const hsh = (s) => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const lines = sent.map((r) => { const v = findVendor(r.inv.extracted); return { utr: "ACH" + String(hsh(r.inv.id)).padStart(10, "0").slice(0, 10), date: today, amount: payCalc(r.inv, today).net, narr: `ACH DEBIT ${(v?.name || "").split(" ").slice(0, 2).join(" ").toUpperCase()} ${r.inv.extracted.invoice_number}`, acct: v?.bank?.slice(-4) || "", match: r.inv.id }; });
  lines.push({ utr: "ACH4417092231", date: today, amount: 1043.25, narr: "ACH DEBIT APEX TRADING CO", acct: "1234", match: null });
  return lines;
}
function reconAgent() {
  const st = bankStatement(); const matched = st.filter((l) => l.match); const un = st.filter((l) => !l.match);
  const steps = [
    { t: "Read today's bank statement", r: `${st.length} debit entr${st.length === 1 ? "y" : "ies"} from the current account (demo file)` },
    { t: "Matched entries to approved invoices", r: `Matched on amount, beneficiary and invoice number: ${matched.length} found` },
    { t: "Checked beneficiary accounts against the vendor master", r: un.length ? `${un.length} payment to an account that isn't in the vendor master` : "All accounts match" },
    { t: "Prepared the results", r: "Ready for the Payments Officer" },
  ];
  const out = () => `<div class="aiout"><b>Reconciliation results</b><div class="scroll"><table><thead><tr><th>Bank entry</th><th class="num">Amount</th><th>Matched to</th><th>Result</th></tr></thead><tbody>
    ${st.map((l) => { const inv = l.match && S.invoices.get(l.match); return `<tr><td class="small"><span class="mono">${h(l.utr)}</span><div class="muted">${h(l.narr)}</div></td><td class="num">${money(l.amount)}</td><td class="small">${inv ? `<a href="#b-inv~${inv.id}" class="mono">${h(inv.extracted.invoice_number)}</a><div class="muted">${h(inv.extracted.vendor_name)}</div>` : "—"}</td><td>${inv ? `<span class="pill t-ok plain">Exact match</span>` : `<span class="pill t-bad plain">No matching invoice</span><div class="small" style="margin-top:4px">Paid to an account ending ${h(l.acct)}, which isn't in the vendor master. The amount equals the fake Apex Trading invoice. Escalate to Fraud & Risk and the bank today.</div>`}</td></tr>`; }).join("")}</tbody></table></div>
    ${matched.length && can("pay") ? `<div class="row"><button class="btn sm ok" data-agact="recon-accept">${icon("check", 14)} Record ${matched.length} match${matched.length > 1 ? "es" : ""} as paid</button><span class="small muted">Uses each entry's ACH trace number as the payment reference. Vendors see it straight away.</span></div>` : matched.length ? `<span class="small muted">The Payments Officer accepts the matches.</span>` : `<span class="small muted">Nothing waiting for payment matched today's statement.</span>`}</div>`;
  return agentPanel("recon", "Reconciliation agent", "Matches bank payments to approved invoices", steps, out, { icon: "card", intro: "Reads today's bank statement, matches every payment to an approved invoice and flags anything that doesn't match.", runLabel: "Reconcile today's statement" });
}

/* ---------- 5. Vendor assistant ---------- */
const VQ = ["When will I be paid?", "Which invoices are overdue?", "Why is an invoice on hold?", "What's the best way to send invoices?", "What do I need to submit an invoice?", "Who is my contact?"];
function vendorAnswer(q) {

  const unpaid = rs.filter((r) => isUnpaid(r.ss.st));
  const byNo = rs.find((r) => { const k = invNoKey(r.inv.extracted.invoice_number); return k && invNoKey(q).includes(k); }) || rs.find((r) => { const tail = (r.inv.extracted.invoice_number || "").split(/[^0-9]/).filter(Boolean).pop(); return tail && tail.length >= 3 && new RegExp("\\b0*" + Number(tail) + "\\b").test(q); });
