  let a, src = `Checked ${rs.length} invoice${rs.length === 1 ? "" : "s"} in your account`;
  if (byNo) { const r = byNo; a = `${r.inv.extracted.invoice_number} for ${money(r.inv.extracted.total)} is ${r.ss.label.toLowerCase()}. ${r.ss.next}${isUnpaid(r.ss.st) ? ` It's due on ${fmtDate(r.ag.due)}${r.ag.over > 0 ? `, ${r.ag.over} days ago` : ""}.` : ""}`; src = `Looked up ${r.inv.extracted.invoice_number}`; }
  else if (/overdue|late|aging|ageing|past due/.test(ql)) { const od = unpaid.filter((r) => r.ag.over > 0).sort((x, y) => y.ag.over - x.ag.over); a = od.length ? `${od.length} invoice${od.length > 1 ? "s are" : " is"} past the due date, ${money(sumOf(od))} in total:\n${od.map((r) => `• ${r.inv.extracted.invoice_number}, ${r.ag.over} days overdue, ${money(r.inv.extracted.total)}: ${r.ss.label.toLowerCase()}`).join("\n")}` : "Nothing is overdue. All your unpaid invoices are within their due dates."; }
  else if (/hold|stuck|why|query|problem|stopped/.test(ql)) { const hold = rs.filter((r) => ["exception", "awaiting_grn", "payment_stopped", "fraud_blocked", "returned"].includes(r.ss.st)); a = hold.length ? `${hold.length} invoice${hold.length > 1 ? "s need" : " needs"} attention:\n${hold.map((r) => `• ${r.inv.extracted.invoice_number}: ${r.ss.next}`).join("\n")}\n\nThe messages on each invoice have the details from ${BUYER.short}'s team.` : "None of your invoices are on hold."; }
  else if (/paid|pay|payment|when|money|remit|utr/.test(ql)) { const sent = unpaid.filter((r) => r.ss.st === "sent"); const appr = unpaid.filter((r) => r.ss.st.startsWith("pending_approval")); const other = unpaid.filter((r) => !sent.includes(r) && !appr.includes(r)); const paid = rs.filter((r) => r.ss.st === "paid").slice(0, 2);
    a = [sent.length && `With our payments team, paid by the due date:\n${sent.map((r) => `• ${r.inv.extracted.invoice_number}, ${money(r.inv.extracted.total)}, due ${fmtDate(r.ag.due)}${r.ag.over > 0 ? ` (${r.ag.over} days overdue)` : ""}`).join("\n")}`, appr.length && `In approval; payment follows approval:\n${appr.map((r) => `• ${r.inv.extracted.invoice_number}, ${money(r.inv.extracted.total)}, due ${fmtDate(r.ag.due)}`).join("\n")}`, other.length && `Not ready for payment yet:\n${other.map((r) => `• ${line(r)}`).join("\n")}`, paid.length && `Recently paid:\n${paid.map((r) => `• ${r.inv.extracted.invoice_number}, ${money(r.inv.decision.paid.amount)} on ${fmtDate(r.inv.decision.paid.date)}, reference ${r.inv.decision.paid.ref}`).join("\n")}`].filter(Boolean).join("\n\n") || "You have no unpaid invoices."; }
  else if (/best way|which way|whatsapp|messenger|telegram|channel|photo|by email|send (my |an |the )?invoices?/.test(ql)) { const st = vendorStats(myVendor()); const un = myNotices().filter((n) => n.kind === "unreadable");
    a = `The best way is to upload the original PDF here on the vendor portal: it's checked before you send it, read first time, and reaches approval in about ${CH_PERF.portal.days} days. If you can't, email the original PDF (not a photo) to ${AP_MAIL} with our PO number.\n\nOf your last ${st.total} invoices, ${st.portal} came through the portal${st.photo ? ` and ${st.photo} as photos on WhatsApp, Messenger or Telegram. Photos take about ${CH_PERF.whatsapp.days} days and ${st.unread ? `${st.unread} of yours couldn't be read` : "may not be readable"}` : ""}.${un.length ? `\n\nWe couldn't read the invoice you sent on ${fmtTime(un[0].at)}. Please resend it on the Submit invoice page.` : ""}`; src = "Checked how your invoices reached us"; }
  else if (/submit|policy|require|need|mandatory|field|format|how/.test(ql)) { a = `To be accepted, an invoice needs: ${POLICY_FIELDS.filter((f) => policyRequired(f.key)).map((f) => f.label.toLowerCase()).join(", ")}. Every line must be on our PO and the total must fit what's left on it. The Submit invoice page checks all of this before you send, so you'll see anything missing straight away.`; src = `Read ${BUYER.short}'s vendor invoice policy`; }

  else if (/^(hi|hello|hey|good)/.test(ql)) a = `Hello! I can tell you when you'll be paid, which invoices are overdue, why one is on hold, or what an invoice needs. Ask about a specific invoice by its number, too.`;
  else { a = `I can answer questions about your invoices, payments, holds and ${BUYER.short}'s invoice policy. For anything else, contact ${ct.name} at ${ct.email}.`; src = "Outside what I can answer"; }
  return { a, src };
}

/* Sample history: the 12 complete months before this one. AI agents went live 6 months ago. */
function leadHistory() {
  const now = new Date(); const out = []; let seed = 7;
  const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  for (let i = 12; i >= 1; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1); const k = 12 - i; // 0..11
    const live = k >= 6; const p = live ? Math.min(1, (k - 5) / 4) : 0; // ramp after go-live
    const n = Math.round(2050 + k * 38 + rnd() * 140);
    out.push({
      label: d.toLocaleString("en-US", { month: "short" }) + (d.getMonth() === 0 || i === 12 ? " " + String(d.getFullYear()).slice(2) : ""),
      live, n, value: Math.round(n * (2380 + rnd() * 260)),
      cycle: +(live ? 11.6 - 7.4 * p + rnd() * 0.6 : 12.8 + rnd() * 1.6).toFixed(1),
      stp: Math.round(live ? 41 + 37 * p + rnd() * 3 : 34 + rnd() * 6),
      cost: +(live ? 10.9 - 6.9 * p + rnd() * 0.4 : 11.6 + rnd() * 0.9).toFixed(2),
      disc: Math.round(live ? 9000 + 33000 * p + rnd() * 4000 : 5200 + rnd() * 3200),
      dupStop: Math.round(live ? 5 + 9 * p + rnd() * 3 : 1 + rnd() * 2),
      exc: +(live ? 19 - 10 * p + rnd() * 1.5 : 21 + rnd() * 3).toFixed(1),
    });
  }
  return out;
}

/* One small line chart (single series, no legend: the title names it). */
function sparkCard(hist, key, title, fmt, goodDown, note) {
  const W = 300, H = 120, pl = 8, pr = 8, pt = 14, pb = 22;
  const vals = hist.map((m) => m[key]); const lo = Math.min(...vals), hi = Math.max(...vals); const span = hi - lo || 1;
  const x = (i) => pl + (i * (W - pl - pr)) / (hist.length - 1); const y = (v) => pt + (1 - (v - lo) / span) * (H - pt - pb);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const gi = hist.findIndex((m) => m.live); const first = vals.slice(0, gi).reduce((a, b) => a + b, 0) / Math.max(1, gi); const last = vals[vals.length - 1];
  const better = goodDown ? last < first : last > first; const chg = first ? ((last - first) / first) * 100 : 0;
  return `<div class="lchart"><div class="lc-h"><span>${h(title)}</span><b>${fmt(last)}</b></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${h(title)}, last 12 months: from ${fmt(vals[0])} to ${fmt(last)}">
      <line x1="${x(gi) - 0.5}" x2="${x(gi) - 0.5}" y1="4" y2="${H - pb}" class="lc-mark"/><text x="${x(gi) + 4}" y="11" class="lc-mt">AI agents live</text>
      <line x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}" class="lc-axis"/>
      <polyline points="${pts}" class="lc-line"/>
      ${vals.map((v, i) => `<g class="lc-pt"><rect x="${x(i) - 12}" y="0" width="24" height="${H - pb}" fill="transparent"/><circle cx="${x(i)}" cy="${y(v)}" r="${i === vals.length - 1 ? 4 : 3}"/><title>${hist[i].label}: ${fmt(v)}</title></g>`).join("")}
      <text x="${pl}" y="${H - 6}" class="lc-t">${hist[0].label}</text><text x="${W - pr}" y="${H - 6}" class="lc-t" text-anchor="end">${hist[hist.length - 1].label}</text>
    </svg>
    <div class="small ${better ? "lc-good" : "muted"}">${better ? "▲" : "▼"} ${chg > 100 ? `${(last / first).toFixed(1)}× the level` : `${Math.abs(chg).toFixed(0)}% ${better ? "better" : "worse"} than`} before agents${note ? ` · ${note}` : ""}</div></div>`;
}

/* Horizontal value bars. rows: [label, count, value, tone, href] */
function vbars(list, opts = {}) {
  const max = Math.max(1, ...list.map((r) => r[2] || 0));

/* Everything the views need, computed once per render */
function leadData() {
  const all = rows(); const today = isoDay(new Date());
  const withX = all.map((r) => { const x = r.st === "paid" ? [] : exTypes(r.inv, r.ev); return { ...r, x: LATE_ST(r.st) ? x.filter((y) => LATE_EX.includes(y.code)) : x }; });
  const open = all.filter((r) => isUnpaid(r.st));
  const blockedSt = (st) => st === "fraud_blocked" || st === "payment_stopped";
  const stopped = withX.filter((r) => isUnpaid(r.st) && (r.st === "fraud_blocked" || r.x.some((x) => PF_ALL.includes(x.code)) || r.inv.decision?.fraudConfirmed) || (r.st === "rejected" && r.inv.decision?.fraudConfirmed));
  const live = open.filter((r) => !stopped.includes(withX.find((w) => w.inv.id === r.inv.id)) && !blockedSt(r.st));
  const overdue = live.filter((r) => agingOf(r.inv.extracted).over > 0);
  const paid = all.filter((r) => r.st === "paid"); const paidRec = paid.map((r) => r.inv.decision.paid);
  const cycle = paid.map((r) => (Date.parse(r.inv.decision.paid.date) - Date.parse(r.inv.createdAt.slice(0, 10))) / DAY).filter((d) => d >= 0);
  const stpOk = (r) => r.ev.rulesOk && r.ev.grnOk && !r.ev.fraud.open.length && !r.ev.fraud.blocked && !r.inv.source?.hand && !r.inv.decision?.override && !r.x.length;
  const P = payPlan();
  const ex = exRows(); const crit = critRows();
  const bankPend = withX.filter((r) => isUnpaid(r.st) && r.x.some((x) => x.code === "EX-14"));
  const sanc = withX.filter((r) => isUnpaid(r.st) && r.x.some((x) => x.code === "EX-22"));
  const pend = all.filter((r) => r.st.startsWith("pending_approval"));
  return { all, withX, open, live, stopped, overdue, paid, paidRec, cycle, stpOk, P, ex, crit, bankPend, sanc, pend, today };
}

function vendorHistory(vid) {
  const now = new Date(); const out = []; let seed = [...vid].reduce((a, c) => a + c.charCodeAt(0), 0);
  const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  for (let i = 12; i >= 1; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1); const k = 12 - i; const live = k >= 6; const p = live ? Math.min(1, (k - 5) / 4) : 0;
    out.push({ label: d.toLocaleString("en-US", { month: "short" }) + (d.getMonth() === 0 || i === 12 ? " " + String(d.getFullYear()).slice(2) : ""), live,
      days: +(live ? 41 - 12 * p + rnd() * 2 : 43 + rnd() * 5).toFixed(0) * 1,
      ftr: Math.round(live ? 74 + 18 * p + rnd() * 3 : 68 + rnd() * 6),
      paid: Math.round((live ? 52000 + 9000 * p : 47000) + rnd() * 9000),
      portal: Math.round(live ? 35 + 50 * p + rnd() * 4 : 18 + rnd() * 6) });
  }
  return out;
}

    <p class="small muted">Leaders sign in on the vendor portal with their own user ID and see the company dashboard and every invoice. They can't submit invoices or send messages.</p>${list}
    ${F.err ? `<div class="note bad"><span>${h(F.err)}</span></div>` : ""}${F.ok ? `<div class="note ok"><span>${h(F.ok)}</span></div>` : ""}
    ${L.length < 5 ? (F.open ? `<form id="f-vl" class="col" style="gap:12px" novalidate><div class="grid-f">${inp("name", "Full name")}${inp("title", "Job title")}${inp("email", "Work email", "email")}${inp("uid", "User ID")}</div>${inp("pw", "Temporary password", "password")}<span class="small muted">At least 10 characters with upper and lower case, a number and a symbol. Share it with them directly; they can change it after signing in.</span><div class="row"><button class="btn primary" type="submit">Add leader</button><button class="btn" type="button" data-vl="cancel">Cancel</button></div></form>` : `<div class="row"><button class="btn" data-vl="open">${icon("user", 14)} Add a leadership login</button></div>`) : ""}</div></div>`;
}
async function vlAdd() {
  const F = S.ui.vl; const v = myVendor(); F.err = F.ok = "";
  const uid = (F.uid || "").trim().toLowerCase(); const pw = document.getElementById("vl-pw")?.value || "";
  if (!(F.name || "").trim() || !(F.title || "").trim()) F.err = "Enter their name and job title.";
  else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test((F.email || "").trim())) F.err = "Enter a valid work email.";
  else if (!/^[a-z0-9._-]{4,30}$/.test(uid)) F.err = "User ID: 4 to 30 characters, letters, numbers, dots, dashes or underscores.";
  else if (S.accounts.has(uid)) F.err = "That user ID is taken. Choose another.";
  else if (pwPolicy(pw, uid)) F.err = pwPolicy(pw, uid);
  if (F.err) { render(); return; }
  const salt = hexOf(crypto.getRandomValues(new Uint8Array(16)));
  await saveAccount({ userId: uid, vendorId: v.id, contactName: F.name.trim(), title: F.title.trim(), email: F.email.trim(), role: "leader", gstin: v.gstin, pan: v.pan, salt, iter: PBKDF2_ITER, hash: await hashPw(pw, salt), createdAt: nowISO(), addedBy: S.vendor.userId });
  demoMail(F.email.trim(), `Your view-only access to ${v.name}'s account with ${BUYER.short}`, `Hello ${F.name.trim().split(" ")[0]},\n\n${vAcct().contactName} has given you a view-only login to the ${BUYER.short} vendor portal.\n\nUser ID: ${uid}\nYou'll get your temporary password from ${vAcct().contactName}. Change it after you sign in.\n\nYou'll see the company dashboard: what ${BUYER.short} owes ${v.name}, expected payment dates and anything that needs your team's attention.`);
  S.ui.vl = { ok: `${F.name.trim()} can now sign in as ${uid}.` }; render();
}
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-vl]"); if (!t) return; const F = S.ui.vl || (S.ui.vl = {});
  if (t.dataset.vl === "open") { S.ui.vl = { open: true }; render(); document.getElementById("vl-name")?.focus(); }
  else if (t.dataset.vl === "cancel") { S.ui.vl = {}; render(); }
  else if (t.dataset.vl === "remove") { const a = S.accounts.get(t.dataset.id); if (!a || a.role !== "leader" || a.vendorId !== myVendor().id) return; S.accounts.delete(a.userId.toLowerCase()); persist(); S.ui.vl = { ok: `${a.contactName}'s login was removed.` }; render(); }
});
document.addEventListener("input", (ev) => { const k = ev.target.dataset.vlf; if (k && k !== "pw") (S.ui.vl = S.ui.vl || {})[k] = ev.target.value; });
document.addEventListener("submit", (ev) => { if (ev.target.id === "f-vl") { ev.preventDefault(); vlAdd(); } });

/* Wiring */
(() => {

  };
  AGX.vViewOnly = isVLeader;
  const r0 = AGX.route; AGX.route = (r) => (r.name === "v-lead" ? vLeadPage() : r0(r));
  const qs0 = AGX.quickSettings; AGX.quickSettings = () => vLeaderCard() + qs0();
})();
const vDashboard0 = vDashboard; vDashboard = function () { return isVLeader() ? vLeadPage() : vDashboard0(); };
const vSubmit0 = vSubmit; vSubmit = function () { return isVLeader() ? vLeadPage() : vSubmit0(); };
const vMessages0 = vMessages; vMessages = function () { return isVLeader() ? vLeadPage() : vMessages0(); };

SCENARIOS.push({ id: "sc13", title: "A vendor's leadership sees their account", who: "Vendor CFO and the vendor's AP user", steps: [
  { t: "Sign in as Daniel Reyes, Summit's CFO (summit.cfo). He lands on the company dashboard: what Ardent owes Summit, past due, expected payments net of discounts and tax, and what needs his team's attention.", as: "vendor:summit.cfo|v-lead" },
  { t: "Open any invoice. His login is view only: no submitting invoices, no messages.", as: "vendor:summit.cfo|v-invoices" },
  { t: "As Megan (Summit's AP user), open Profile and add another leadership login. She sees the same company dashboard from her menu.", as: "vendor:summit.ap|v-profile" } ] });

(function boot() {
  const saved = readSaved();
  SHIFT = saved ? saved.shift : computeShift();
  const seeds = buildSeeds();
  applyShiftToReference();
  S.accounts = new Map(DEMO_ACCOUNTS.map((a) => [a.userId, a]));
  if (saved) {
    S.invoices = new Map((saved.invoices || []).map((i) => [i.id, i])); S.receiptsExtra = saved.receiptsExtra || [];
    S.settings = { ...S.settings, ...(saved.settings || {}) }; S.mailbox = saved.mailbox || []; S.guide = saved.guide || null;
    for (const a of saved.accounts || []) { const demo = DEMO_ACCOUNTS.find((x) => x.userId === a.userId); S.accounts.set(a.userId.toLowerCase(), demo && demo.hash === a.hash ? { ...a, demoPassword: demo.demoPassword } : a); }
    if (saved.staff && staffById(saved.staff.id)) S.staff = saved.staff;
    if (saved.vendor && S.accounts.get(saved.vendor.userId)) S.vendor = saved.vendor;
  } else S.invoices = new Map(seeds.map((i) => [i.id, i]));
  if (typeof AGX !== "undefined") AGX.boot(saved);
  parseRoute(); render();
  const fromUrl = () => { const t = hashTok(); if (t === ROUTE_TOK) return; ROUTE_TOK = t; parseRoute(); S.ui.side = false; S.ui.switcher = false; render(); window.scrollTo(0, 0); };
  window.addEventListener("hashchange", fromUrl); window.addEventListener("popstate", fromUrl);
  window.addEventListener("click", (e) => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const a = e.target.closest && e.target.closest("a[href^='#']"); if (!a || a.target) return;
    e.preventDefault(); navTo(decodeURIComponent(a.getAttribute("href").slice(1)));
  });
})();
